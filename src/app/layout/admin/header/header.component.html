<header class="header-container">
    <!-- LEFT SIDE: Hamburger + Date -->
    <div class="header-left">
        <!-- HAMBURGER TOGGLE (Mobile Only) -->
        <button (click)="layoutService.toggleSidebar()" class="hamburger-btn">
            <span class="material-icons-outlined">menu</span>
        </button>

        <!-- DATE TIME DISPLAY -->
        <div class="datetime-display">
            <span class="material-icons-outlined">calendar_today</span>
            <span class="datetime-text">{{ currentDate }}</span>
        </div>
    </div>

    <!-- RIGHT SIDE: Profile & Logout -->
    <div class="header-right">
        <!-- USER PROFILE AREA -->
        <div class="user-profile-area">
            <!-- Avatar & Info -->
            <div (click)="goToProfile()" class="profile-trigger">
                <div class="avatar">
                    {{ user().username ? user().username![0].toUpperCase() : 'U' }}
                </div>
                <div class="profile-info">
                    <p class="profile-name">{{ user().username || 'User' }}</p>
                    <div class="profile-role">
                        <span class="status-dot"></span>
                        <span class="role-text">{{ userRole() }}</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- DIVIDER -->
        <div class="header-divider"></div>

        <!-- LOGOUT BUTTON -->
        <button (click)="onLogout()" class="logout-btn" title="Logout">
            <span class="material-icons-outlined">logout</span>
        </button>
    </div>
</header>
