# =============================================================================
# CI PIPELINE UNTUK LOANOVA FRONTEND (Angular)
# =============================================================================
#
# Workflow ini akan berjalan otomatis setiap kali ada:
# - Push ke branch main/master
# - Pull Request ke branch main/master
#
# STEPS:
# 1. Checkout kode dari repository
# 2. Setup Node.js 20
# 3. Install dependencies
# 4. Run Unit Tests (Vitest)
# 5. Build production
# =============================================================================

name: Frontend CI

# Trigger: Kapan workflow ini dijalankan
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout - Mengambil kode dari repository
    - name: Checkout Repository
      uses: actions/checkout@v4
    
    # Step 2: Setup Node.js
    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'  # Cache npm dependencies untuk speed up
        
    # Step 3: Install Dependencies
    - name: Install Dependencies
      run: npm ci  # Lebih cepat dan konsisten dari npm install
        
    # Step 4: Run Unit Tests
    # Menjalankan hanya plafond.service.spec.ts
    - name: Run Unit Tests
      run: npx ng test --include="src/app/core/services/plafond.service.spec.ts" --no-watch
      
    # Step 5: Build Production
    - name: Build Production
      run: npm run build
